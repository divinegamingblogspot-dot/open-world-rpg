name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Build Neon Isles APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -lc 'apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq curl >/dev/null 2>&1; sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null; mkdir -p /root/.local/share/godot/export_templates/4.4.1.stable /tmp/godot-templates; curl -L --fail --silent --show-error https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/godot-templates/export.tpz; unzip -q /tmp/godot-templates/export.tpz -d /tmp/godot-templates/unpacked; find /tmp/godot-templates/unpacked -name "android_debug.apk" -exec cp {} /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk \;; find /tmp/godot-templates/unpacked -name "android_release.apk" -exec cp {} /root/.local/share/godot/export_templates/4.4.1.stable/android_release.apk \;; keytool -genkeypair -keystore /project/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048 -noprompt >/dev/null 2>&1; test -f /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk; godot --headless --path /project --export-debug "Android" /project/build/Neon-Isles.apk'

      - name: Verify APK
        run: |
          test -f build/Neon-Isles.apk
          ls -lh build/Neon-Isles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Isles-Android
          path: build/Neon-Isles.apk
          retention-days: 30
