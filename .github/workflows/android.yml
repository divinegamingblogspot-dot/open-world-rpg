name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Build Neon Isles APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --path /project --export-debug "Android" /project/build/Neon-Isles.apk

      - name: Verify APK
        run: |
          test -f build/Neon-Isles.apk
          ls -lh build/Neon-Isles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Isles-Android
          path: build/Neon-Isles.apk
          retention-days: 30
