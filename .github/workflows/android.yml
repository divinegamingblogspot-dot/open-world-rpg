name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Build Neon Isles APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          rm -f debug.keystore
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048 \
            -noprompt

      - name: Build Android APK with Godot CI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.3 \
            bash -lc '
              set -euxo pipefail
              mkdir -p /root/.local/share/godot/export_templates /root/.config
              if [ -d /root/.local/share/godot/templates/4.3.stable ] && [ ! -d /root/.local/share/godot/export_templates/4.3.stable ]; then
                cp -a /root/.local/share/godot/templates/4.3.stable /root/.local/share/godot/export_templates/4.3.stable
              fi
              godot --headless --version
              godot --headless --path /project --editor --quit
              godot --headless --path /project --verbose --export-debug "Android" /project/build/Neon-Isles.apk
            '

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s build/Neon-Isles.apk
          file build/Neon-Isles.apk
          ls -lh build/Neon-Isles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Isles-Android
          path: build/Neon-Isles.apk
          if-no-files-found: error
          retention-days: 30
