name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Build Neon Isles APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot templates and config
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable; fi
          if [ -d /root/.local/share/godot/templates/4.3.stable ]; then mv /root/.local/share/godot/templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable; fi

      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048 -noprompt

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Neon-Isles.apk

      - name: Verify APK
        run: |
          test -f build/Neon-Isles.apk
          ls -lh build/Neon-Isles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Isles-Android
          path: build/Neon-Isles.apk
          retention-days: 30
