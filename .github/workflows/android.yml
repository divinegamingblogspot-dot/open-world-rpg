name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Build Neon Isles APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -lc 'export HOME=/root; mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"; if [ -d "$HOME/.local/share/godot/templates/4.4.1.stable" ]; then mv "$HOME/.local/share/godot/templates/4.4.1.stable" "$HOME/.local/share/godot/export_templates/4.4.1.stable"; fi; sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null; keytool -genkeypair -keystore /project/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048 -noprompt >/dev/null 2>&1; test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"; godot --headless --path /project --export-debug "Android" /project/build/Neon-Isles.apk'

      - name: Verify APK
        run: |
          test -f build/Neon-Isles.apk
          ls -lh build/Neon-Isles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Isles-Android
          path: build/Neon-Isles.apk
          retention-days: 30
