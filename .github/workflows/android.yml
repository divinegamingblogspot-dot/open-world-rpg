name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Build Neon Isles APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -lc 'yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-35" "build-tools;35.0.1"; mkdir -p /root/.config/godot; printf "%s\\n" "[gd_resource type=\\\"EditorSettings\\\" format=3]" "" "[resource]" "export/android/android_sdk_path = \\\"/usr/lib/android-sdk\\\"" "export/android/java_sdk_path = \\\"/usr/lib/jvm/java-17-openjdk-amd64\\\"" "export/android/debug_keystore = \\\"/root/debug.keystore\\\"" "export/android/debug_keystore_user = \\\"androiddebugkey\\\"" "export/android/debug_keystore_pass = \\\"android\\\"" "export/android/force_system_user = false" "export/android/target_sdk = 35" > /root/.config/godot/editor_settings-4.tres; godot --headless --path /project --export-debug "Android" /project/build/Neon-Isles.apk'

      - name: Verify APK
        run: |
          test -f build/Neon-Isles.apk
          ls -lh build/Neon-Isles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Isles-Android
          path: build/Neon-Isles.apk
          retention-days: 30
